name: Garmin sync

on:
  schedule:
    # Every 30 min: users who pressed "sync now" are picked up quickly;
    # everyone else is synced at most every 3 hours (see --min-interval-hours).
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garmin-sync/requirements.txt

      - name: Install dependencies
        run: pip install -r garmin-sync/requirements.txt

      - name: Sync linked Garmin accounts
        working-directory: garmin-sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_all.py --min-interval-hours 3 --tokens-only
